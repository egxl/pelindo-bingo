<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PELINDO! · Kartu PRIOK</title>
  <style>
    :root {
      --bg: #FFFDF5;
      --surface: #FFFFFF;
      --ink: #0A0A0A;
      --muted: #525252;
      --yellow: #FFD93D;
      --cyan: #38BDF8;
      --green: #2EE59D;
      --violet: #C4B5FD;
      --coral: #FF6B6B;
      --amber: #FF9F1C;
      --font-display: "Arial Black", "Segoe UI Black", Impact, system-ui, -apple-system, sans-serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(var(--ink) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink);
      font-family: var(--font-body);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px 18px;
      user-select: none;
    }
    .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 9px; }

    /* Top Ticket Stub */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--yellow);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      border-radius: 0;
      padding: 8px 12px;
    }
    .brand {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1;
    }
    .brand span {
      display: inline-block;
      background: var(--coral);
      border: 2px solid var(--ink);
      padding: 0 4px;
      margin-left: 2px;
    }
    .meta { font-size: 12px; color: var(--ink); text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .meta strong {
      font-size: 13px;
      font-weight: 900;
      color: var(--ink);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta span {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 900;
      background: var(--surface);
      border: 2px solid var(--ink);
      padding: 1px 6px;
    }

    /* Live Clue Status Banner */
    .status-bar {
      background: var(--surface);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      border-radius: 0;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 700;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--ink);
    }
    .pill {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 0;
      border: 2px solid var(--ink);
      background: var(--violet);
      color: var(--ink);
      white-space: nowrap;
      text-transform: uppercase;
    }
    .pill.live { background: var(--green); }

    /* Column Headers (P-R-I-O-K / P-E-L-I-N-D-O) */
    .col-headers {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .col-headers.g7 {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .col-h {
      text-align: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 18px;
      padding: 5px 0;
      border-radius: 0;
      border: 2.5px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      color: var(--ink);
      background: var(--yellow);
    }
    .col-h:nth-child(even) { background: var(--cyan); }
    .col-headers.g7 .col-h {
      font-size: 14px;
      padding: 4px 0;
      border-width: 2px;
    }

    /* Tap-Readability Inspector */
    .tap-preview {
      background: var(--surface);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      border-radius: 0;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 34px;
    }
    .preview-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .preview-bab {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 900;
      color: var(--ink);
      border: 1.5px solid var(--ink);
      padding: 1px 5px;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tap-preview strong {
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-word;
    }
    .preview-state {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Bingo Tile Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }
    .grid.g7 {
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .tile {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--surface);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 9px 4px 4px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.12;
      color: var(--ink);
      cursor: pointer;
      transition: transform 0.06s, box-shadow 0.06s, background-color 0.06s;
      word-break: normal;
      overflow-wrap: break-word;
      overflow: hidden;
    }
    .tile:not(.free)::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: var(--bab-color, var(--ink));
      border-bottom: 1.5px solid var(--ink);
    }
    .grid.g7 .tile {
      border-width: 2px;
      box-shadow: 2px 2px 0 var(--ink);
      padding: 7px 2px 2px;
      min-height: 44px;
      font-size: clamp(7.2px, 1.95vw, 9.8px);
      line-height: 1.08;
      overflow-wrap: break-word;
    }
    .grid.g7 .tile:not(.free)::before {
      height: 4px;
      border-bottom-width: 1px;
    }
    .tile:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    .tile.marked {
      background: var(--yellow);
      color: var(--ink);
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    .tile.marked::after {
      content: '✓';
      position: absolute;
      top: 0;
      right: 0;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      padding: 1px 3px;
      background: var(--ink);
      color: var(--yellow);
    }
    .grid.g7 .tile.marked::after {
      font-size: 8px;
      padding: 1px 2px;
    }
    .tile.free {
      background: var(--green);
      color: var(--ink);
      font-size: 10px;
      font-weight: 900;
      padding: 4px;
      cursor: default;
    }
    .grid.g7 .tile.free { font-size: clamp(7.5px, 1.9vw, 9.5px); padding: 2px; }
    .tile.win-line {
      background: var(--amber);
      color: var(--ink);
      transform: translate(0, 0);
      box-shadow: 3px 3px 0 var(--ink);
      outline: 2.5px solid var(--coral);
      outline-offset: -4px;
    }
    .grid.g7 .tile.win-line {
      box-shadow: 2px 2px 0 var(--ink);
      outline-width: 2px;
      outline-offset: -3px;
    }

    /* Message & Claim Buzzer */
    .msg {
      text-align: center;
      font-size: 13px;
      font-weight: 900;
      min-height: 20px;
      padding: 8px 10px;
      border-radius: 0;
      display: none;
      color: var(--ink);
    }
    .msg.show { display: block; }
    .msg.err {
      background: var(--coral);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .msg.win {
      background: var(--yellow);
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 14px;
    }

    .claim-btn {
      width: 100%;
      padding: 14px 12px;
      border-radius: 0;
      border: 3px solid var(--ink);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      background: #E5E4DC;
      color: var(--muted);
      cursor: not-allowed;
      transition: transform 0.06s, box-shadow 0.06s, background-color 0.06s;
    }
    .claim-btn.ready {
      background: var(--green);
      color: var(--ink);
      border: 4px solid var(--ink);
      box-shadow: 5px 5px 0 var(--ink);
      cursor: pointer;
      font-size: 17px;
      animation: buzzerPulse 0.8s steps(2, end) infinite;
    }
    .claim-btn.ready:active {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 var(--ink);
      animation: none;
    }
    @keyframes buzzerPulse {
      0% { background-color: var(--green); }
      50% { background-color: var(--yellow); }
      100% { background-color: var(--green); }
    }

    /* Join Modal Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }
    .overlay.hidden { display: none; }
    .join-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 4px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      border-radius: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
    .join-badge {
      background: var(--yellow);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      padding: 8px 12px;
      transform: rotate(-1deg);
    }
    .join-card h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    .join-card p {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.4;
    }
    .join-card input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 0;
      border: 3px solid var(--ink);
      box-shadow: inset 2px 2px 0 rgba(0, 0, 0, 0.08);
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      outline: none;
      text-align: center;
    }
    .join-card input:focus { background: #FFFFFF; box-shadow: 4px 4px 0 var(--cyan); }
    .join-card button {
      width: 100%;
      padding: 13px;
      border-radius: 0;
      border: 3px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      background: var(--green);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.06s, box-shadow 0.06s;
    }
    .join-card button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }
  </style>
</head>
<body>
  <div class="overlay" id="joinOverlay">
    <div class="join-card">
      <div class="join-badge"><h1>PELINDO!</h1></div>
      <p>Edisi Tanjung Priok · Kartu Bingo<br/>Masukkan nama panggilan untuk podium hadiah!</p>
      <input id="nameInput" type="text" maxlength="28" placeholder="Nama / Inisial Anda..." autocomplete="off" />
      <button id="joinBtn">MASUK &amp; AMBIL KARTU</button>
    </div>
  </div>

  <div class="app">
    <div class="topbar">
      <div class="brand">PELINDO<span>!</span></div>
      <div class="meta">
        <strong id="playerName">-</strong>
        <span id="cardTag">Kartu #---</span>
      </div>
    </div>

    <div class="status-bar">
      <div id="clueText">Menunggu MC memulai permainan...</div>
      <span class="pill" id="phasePill">LOBBY</span>
    </div>

    <div class="col-headers g5" id="colHeaders">
      <div class="col-h">P</div>
      <div class="col-h">R</div>
      <div class="col-h">I</div>
      <div class="col-h">O</div>
      <div class="col-h">K</div>
    </div>

    <div class="tap-preview" id="tapPreview"><span>Ketuk kotak untuk menandai &amp; melihat teks penuh</span></div>

    <div class="grid g5" id="grid"></div>

    <div class="msg" id="msgBox"></div>
    <button class="claim-btn" id="claimBtn" disabled>LENGKAPI 1 GARIS UNTUK CLAIM PELINDO!</button>
  </div>

  <script>
    const STORAGE_KEY = 'pelindo_priok_card_v1';
    const CHAPTER_COLORS = {
      'Company Profile': '#38BDF8',
      'Business Process': '#2EE59D',
      'Visited Experience': '#C4B5FD',
      'Business Challenge': '#FF6B6B',
    };

    let session = null;
    let marked = new Set([12]);
    let stateVersion = 0;
    let winningLine = null;

    const $ = (id) => document.getElementById(id);

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function buildWinLines(n) {
      const lines = [];
      for (let r = 0; r < n; r++) {
        lines.push(Array.from({ length: n }, (_, c) => r * n + c));
        lines.push(Array.from({ length: n }, (_, c) => c * n + r));
      }
      lines.push(Array.from({ length: n }, (_, i) => i * n + i));
      lines.push(Array.from({ length: n }, (_, i) => i * n + (n - 1 - i)));
      return lines;
    }

    function getFreeIndex(gridSize) {
      return Math.floor((gridSize * gridSize) / 2);
    }

    function saveLocal() {
      if (!session) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        gameId: session.gameId,
        gridSize: session.gridSize,
        headers: session.headers,
        playerId: session.playerId,
        cardNum: session.cardNum,
        name: session.name,
        grid: session.grid,
        wonRank: session.wonRank,
        marked: Array.from(marked),
      }));
    }

    function findCompletedLine() {
      if (!session) return null;
      const lines = buildWinLines(session.gridSize || 5);
      for (const line of lines) {
        if (line.every((idx) => marked.has(idx))) return line;
      }
      return null;
    }

    function renderHeaders() {
      const gridSize = session.gridSize || 5;
      const headers = session.headers || (gridSize === 7 ? ['P','E','L','I','N','D','O'] : ['P','R','I','O','K']);
      const el = $('colHeaders');
      el.className = `col-headers g${gridSize}`;
      el.innerHTML = headers.map((h) => `<div class="col-h">${escapeHtml(h)}</div>`).join('');
    }

    function updateTapPreview(cell, isMarked) {
      const el = $('tapPreview');
      if (!cell) {
        el.innerHTML = '<span>Ketuk kotak untuk menandai &amp; melihat teks penuh</span>';
        return;
      }
      const babColor = CHAPTER_COLORS[cell.bab] || '#FFD93D';
      el.innerHTML = `
        <span class="preview-left">
          <span class="preview-bab" style="background:${babColor};">${escapeHtml(cell.bab || '')}</span>
          <strong>${escapeHtml(cell.shortLabel)}</strong>
        </span>
        <span class="preview-state">${isMarked ? 'DITANDAI ✓' : 'BATAL'}</span>
      `;
    }

    function renderGrid() {
      const gridSize = session.gridSize || 5;
      renderHeaders();
      const gridEl = $('grid');
      gridEl.className = `grid g${gridSize}`;
      gridEl.innerHTML = '';
      session.grid.forEach((cell, idx) => {
        const div = document.createElement('div');
        div.className = 'tile' + (cell.isFree ? ' free' : '') + (marked.has(idx) && !cell.isFree ? ' marked' : '');
        if (!cell.isFree) {
          div.style.setProperty('--bab-color', CHAPTER_COLORS[cell.bab] || '#0A0A0A');
        }
        if (winningLine && winningLine.includes(idx)) div.classList.add('win-line');
        div.textContent = cell.shortLabel;
        if (!cell.isFree && !session.wonRank) {
          div.setAttribute('role', 'button');
          div.setAttribute('tabindex', '0');
          const toggleTile = () => {
            const willMark = !marked.has(idx);
            if (willMark) marked.add(idx);
            else marked.delete(idx);
            navigator.vibrate?.(25);
            updateTapPreview(cell, willMark);
            saveLocal();
            renderGrid();
            updateClaimButton();
          };
          div.onclick = toggleTile;
          div.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleTile();
            }
          };
        }
        gridEl.appendChild(div);
      });
      updateClaimButton();
    }

    function updateClaimButton() {
      const btn = $('claimBtn');
      if (session.wonRank) {
        btn.disabled = true;
        btn.className = 'claim-btn ready';
        btn.textContent = `🏆 JUARA #${session.wonRank} — MAJU KE PANGGUNG!`;
        return;
      }
      const line = findCompletedLine();
      if (line) {
        btn.disabled = false;
        btn.className = 'claim-btn ready';
        btn.textContent = '🏆 CLAIM PELINDO!';
      } else {
        btn.disabled = true;
        btn.className = 'claim-btn';
        btn.textContent = 'LENGKAPI 1 GARIS UNTUK CLAIM PELINDO!';
      }
    }

    function showMsg(text, type) {
      const box = $('msgBox');
      box.textContent = text;
      box.className = `msg show ${type}`;
    }

    async function joinGame(name, existingPlayerId = null) {
      const res = await fetch('/api/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, playerId: existingPlayerId }),
      });
      const data = await res.json();
      if (!data.ok) return;
      if (!session || session.gameId !== data.gameId) {
        marked = new Set([getFreeIndex(data.gridSize || 5)]);
        winningLine = null;
        $('msgBox').className = 'msg';
        updateTapPreview(null, false);
      }
      session = data;
      $('playerName').textContent = session.name;
      $('cardTag').textContent = `Kartu #${String(session.cardNum).padStart(3, '0')}`;
      $('joinOverlay').classList.add('hidden');
      saveLocal();
      renderGrid();
    }

    $('joinBtn').onclick = async () => {
      const name = $('nameInput').value.trim();
      $('joinBtn').disabled = true;
      await joinGame(name || 'Kapten Tamu');
      $('joinBtn').disabled = false;
    };

    $('nameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('joinBtn').click();
      }
    });

    $('claimBtn').onclick = async () => {
      const line = findCompletedLine();
      if (!line || !session) return;
      $('claimBtn').disabled = true;
      try {
        const res = await fetch('/api/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            playerId: session.playerId,
            name: session.name,
            lineIndices: line,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          session.wonRank = data.rank;
          winningLine = data.winEntry ? data.winEntry.lineIndices : line;
          navigator.vibrate?.([40, 30, 80]);
          saveLocal();
          renderGrid();
          showMsg(`SELAMAT! Anda JUARA #${data.rank} PELINDO! Silakan maju ke panggung!`, 'win');
        } else {
          showMsg(data.reason || 'Belum valid!', 'err');
          updateClaimButton();
        }
      } catch {
        showMsg('Koneksi lambat, coba ketuk lagi!', 'err');
        updateClaimButton();
      }
    };

    async function pollState() {
      try {
        const res = await fetch(`/api/state?v=${stateVersion}`);
        if (res.status === 200) {
          const st = await res.json();
          stateVersion = st.v;
          if (session && st.gameId !== session.gameId) {
            localStorage.removeItem(STORAGE_KEY);
            await joinGame(session.name, null);
          }
          const pill = $('phasePill');
          pill.textContent = st.phase === 'PLAYING' ? `CALL #${st.callIndex}` : st.phase;
          pill.className = 'pill' + (st.phase === 'PLAYING' ? ' live' : '');

          if (st.phase === 'LOBBY') {
            $('clueText').textContent = `Siap! ${st.playerCount} peserta bergabung. Menunggu MC...`;
          } else if (st.currentClue) {
            if (st.currentClue.revealed) {
              $('clueText').innerHTML = `<strong>[${escapeHtml(st.currentClue.bab)}] ${escapeHtml(st.currentClue.shortLabel)}</strong>`;
            } else {
              $('clueText').innerHTML = `<strong>[${escapeHtml(st.currentClue.bab)}]:</strong> Lihat clue di layar!`;
            }
          }
          if (st.phase === 'ENDED' && (!session || !session.wonRank)) {
            showMsg('Podium Juara 1–3 sudah terisi! Terima kasih telah bermain.', 'err');
          }
        }
      } catch {}
      setTimeout(pollState, 2000 + Math.floor(Math.random() * 800));
    }

    (async function init() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (saved && saved.playerId) {
          session = saved;
          marked = new Set(saved.marked || [12]);
          await joinGame(saved.name, saved.playerId);
        }
      } catch {}
      pollState();
    })();
  </script>
</body>
</html>
